# visor-wm: the tiling window manager, configured like Hyprland's
# hyprland.conf. Saving this file applies it at once. The defaults match
# Omarchy's look. Copy this folder to ~/.config/visor to customise it.

general {
    gaps_in = 5           # half the space between two windows
    gaps_out = 10         # space between windows and the screen edges / bar
    border_size = 2       # 0 leaves window borders alone (Windows draws 1 px)
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

dwindle {
    default_split_ratio = 1.0   # 0.1 - 1.9; 1.0 splits evenly
    preserve_split = true       # a split keeps its direction when windows close
    force_split = 2             # new windows go right/bottom (0: cursor side, 1: left/top)
}

# Window rules: float or tile windows matching class:, title: and/or exe:
# (regexes; exe: ignores case). The last matching rule wins. Use ## for a
# literal #. Dialogs, fixed-size, always-on-top and elevated windows (such as
# Task Manager) float by default. Store apps all run in ApplicationFrameHost.exe
# with class ApplicationFrameWindow, so match those by title.
windowrule = float, class:^ApplicationFrameWindow$, title:^Calculator$
# windowrule = tile, exe:^someapp\.exe$   # tile a fixed-size app anyway
