# visor-wm: the tiling window manager, configured like Hyprland's
# hyprland.conf. Saving this file applies it at once. The defaults match
# Omarchy's look. Copy this folder to ~/.config/visor to customise it.

general {
    gaps_in = 5           # half the space between two windows
    gaps_out = 10         # space between windows and the screen edges / bar
    border_size = 2       # 0 leaves window borders alone (Windows draws 1 px)
    col.active_border = accent        # Windows' accent colour, as it changes
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# source = ~/.config/visor/more.conf   # include another file (optional)

dwindle {
    default_split_ratio = 1.0   # 0.1 - 1.9; 1.0 splits evenly
    preserve_split = true       # a split keeps its direction when windows close
    force_split = 2             # new windows go right/bottom (0: cursor side, 1: left/top)
}

# Window rules: float or tile windows matching class:, title: and/or exe:
# (regexes; exe: ignores case). The last matching rule wins. Use ## for a
# literal #. Dialogs, fixed-size, always-on-top and elevated windows (such as
# Task Manager) float by default. Store apps all run in ApplicationFrameHost.exe
# with class ApplicationFrameWindow, so match those by title.
windowrule = float, class:^ApplicationFrameWindow$, title:^Calculator$
# windowrule = tile, exe:^someapp\.exe$   # tile a fixed-size app anyway

# Key bindings, as in hyprland.conf:
#   bind = MODS, key, dispatcher[, argument]
#   bindd = MODS, key, description, dispatcher[, argument]   (described)
#   binde = ...                                               (repeats while held)
#   bindr = ...                                               (on release, if pressed alone)
# MODS: SUPER, SHIFT, CTRL, ALT. Dispatchers: exec, killactive, togglefloating,
# fullscreen (0: whole monitor, 1: maximise), movefocus, swapwindow (l r u d),
# workspace, movetoworkspace(silent), closeworkspace (see below),
# togglesplit, resizeactive (dx dy, in pixels), and visor (a command for
# Visor: launcher, menu, keys, run, theme; shell.qml decides what each does).
# Bindings separated by a blank line form a group in the cheat sheet.
# Win+L always locks: Windows reserves it.
$mainMod = SUPER
$terminal = wt.exe
$fileManager = explorer.exe ::{20D04FE0-3AEA-1069-A2D8-08002B30309D}

# A bare Win press opens the launcher, as it opens Start. Win+S (search),
# Win+X (the power menu) and Win+R (Run) are Windows' keys too; Super+K is
# Omarchy's cheat sheet.
bindrd = $mainMod, SUPER_L, Launcher, visor, launcher
bindd = $mainMod, S, Launcher, visor, launcher
bindd = $mainMod, X, System menu, visor, menu
bindd = $mainMod, K, Key bindings, visor, keys
bindd = $mainMod, R, Run, visor, run

# Windows themes (wallpaper, dark/light, accent): Omarchy's key for the next
# one. `visor, theme` opens the picker (also in the Win+X menu).
bindd = $mainMod CTRL SHIFT, space, Next theme, visor, theme next

bindd = $mainMod, Return, Terminal, exec, $terminal
bindd = $mainMod, E, File manager, exec, $fileManager

bindd = $mainMod, W, Close window, killactive
bindd = $mainMod, V, Toggle floating, togglefloating
bindd = $mainMod, F, Fullscreen, fullscreen, 0
bindd = $mainMod ALT, F, Maximise, fullscreen, 1
bindd = $mainMod, J, Toggle split, togglesplit

bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d

bindd = $mainMod SHIFT, left, Swap left, swapwindow, l
bindd = $mainMod SHIFT, right, Swap right, swapwindow, r
bindd = $mainMod SHIFT, up, Swap up, swapwindow, u
bindd = $mainMod SHIFT, down, Swap down, swapwindow, d

bindde = $mainMod, minus, Narrower, resizeactive, -100 0
bindde = $mainMod, equal, Wider, resizeactive, 100 0
bindde = $mainMod SHIFT, minus, Shorter, resizeactive, 0 -100
bindde = $mainMod SHIFT, equal, Taller, resizeactive, 0 100

# Desktops work like Windows 11's virtual desktops: create as many as you
# like, and each covers every monitor. The first four keys are Windows' own;
# Windows has no key for moving a window (it uses Task View), hence the last two.
bindd = $mainMod CTRL, D, New desktop, workspace, new
bindd = $mainMod CTRL, F4, Close desktop, closeworkspace
bindd = $mainMod CTRL, left, Previous desktop, workspace, e-1
bindd = $mainMod CTRL, right, Next desktop, workspace, e+1
bindd = $mainMod CTRL SHIFT, left, Move window to previous desktop, movetoworkspace, e-1
bindd = $mainMod CTRL SHIFT, right, Move window to next desktop, movetoworkspace, e+1
